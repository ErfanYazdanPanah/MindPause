<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindPause</title>

    <link rel="stylesheet" href="countdown.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="leaf">
                🌿
            </div>

            <h1>
                یک لحظه مکث کن...
            </h1>


            <div class="timer-box">

                <svg width="220" height="220">

                    <circle
                        class="circle-bg"
                        cx="110"
                        cy="110"
                        r="95">
                    </circle>


                    <circle
                        class="circle-progress"
                        id="progress"
                        cx="110"
                        cy="110"
                        r="95">
                    </circle>

                </svg>


                <div id="timer">
                    15
                </div>

            </div>


            <p id="message">
                یک نفس عمیق بکش.
            </p>


        </div>

    </div>


<script src="countdown.js"></script>

</body>

</html>
